services:

  neo4j:
    image: neo4j:latest
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
    - neo4j_data:/data
    - ./import:/var/lib/neo4j/import
    environment:
      - NEO4J_AUTH=neo4j/123456789
      - NEO4J_dbms_default__database=test
      - NEO4JLABS_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*


  rasa:
    build:
      context: ./rasa
      dockerfile: Dockerfile
    ports:
      - "5005:5005"
    depends_on:
      - action_server
    environment:
      - NEO4J_DATABASE=test

  frontend_client:
    build: 
      context: ./frontend_client
      dockerfile: Dockerfile
    ports:
      - "8282:8282"
    depends_on:
      - rasa

  action_server:
    build: 
      context: ./actions
      dockerfile: Dockerfile
    container_name: action_server
    ports:
      - "5055:5055"
    environment:
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=123456789
      - NEO4J_DATABASE=neo4j

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - neo4j

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  neo4j_data: